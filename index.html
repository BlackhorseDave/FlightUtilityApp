<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Flight Utility">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Flight Utility</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Flight Utility</p>
          <h1>Quick cockpit math</h1>
        </div>
        <span id="installState" class="install-state">Offline ready</span>
      </header>

      <nav class="tabs" aria-label="Utility tabs">
        <button class="tab-button active" type="button" data-tab="coordinates">Coordinates</button>
        <button class="tab-button" type="button" data-tab="fuel">Fuel</button>
        <button class="tab-button" type="button" data-tab="time">Time / Calculator</button>
      </nav>

      <section id="coordinates" class="tab-panel active" aria-labelledby="coordinates-tab">
        <div class="input-stack">
          <label for="coordInput">Paste coordinate</label>
          <div class="input-action-row">
            <input id="coordInput" type="text" inputmode="text" autocomplete="off" placeholder="063509.24N 0033356.29E">
            <button id="coordParse" class="primary-button" type="button">Parse</button>
          </div>
          <div class="button-row">
            <button id="coordPaste" type="button">Paste</button>
            <button id="coordClear" type="button">Clear</button>
          </div>
        </div>

        <div class="result-list" id="coordResults">
          <article class="result-card">
            <span>Detected Format</span>
            <strong id="coordDetected">-</strong>
          </article>
          <article class="result-card">
            <span>Status</span>
            <strong id="coordStatus">Ready</strong>
          </article>
          <article class="result-card copyable">
            <span>Decimal Degrees</span>
            <button type="button" data-copy-target="coordDecimal" aria-label="Copy decimal degrees">
              <strong id="coordDecimal">-</strong>
            </button>
          </article>
          <article class="result-card copyable">
            <span>Degrees Decimal Minutes</span>
            <button type="button" data-copy-target="coordDdm" aria-label="Copy degrees decimal minutes">
              <strong id="coordDdm">-</strong>
            </button>
          </article>
          <article class="result-card copyable">
            <span>Degrees Minutes Seconds</span>
            <button type="button" data-copy-target="coordDms" aria-label="Copy degrees minutes seconds">
              <strong id="coordDms">-</strong>
            </button>
          </article>
          <article class="result-card copyable">
            <span>Compact Aviation DMS</span>
            <button type="button" data-copy-target="coordCompact" aria-label="Copy compact aviation DMS">
              <strong id="coordCompact">-</strong>
            </button>
          </article>
          <article class="result-card copyable">
            <span>ForeFlight Format</span>
            <button type="button" data-copy-target="coordForeflight" aria-label="Copy ForeFlight format">
              <strong id="coordForeflight">-</strong>
            </button>
          </article>
          <article class="result-card muted">
            <span>UTM</span>
            <strong id="coordUtm">Browser build: pending geodesy support</strong>
          </article>
          <article class="result-card muted">
            <span>MGRS</span>
            <strong id="coordMgrs">Browser build: pending geodesy support</strong>
          </article>
        </div>
      </section>

      <section id="fuel" class="tab-panel" aria-labelledby="fuel-tab">
        <div class="input-stack">
          <label for="fuelType">Fuel type</label>
          <select id="fuelType">
            <option>Jet A</option>
            <option>Avgas</option>
            <option>Regular Gasoline</option>
            <option>Diesel</option>
          </select>
        </div>

        <div class="fuel-grid" id="fuelGrid">
          <label>Pounds<input id="fuelPounds" data-unit="Pounds" type="number" inputmode="decimal" step="any"></label>
          <label>Kilograms<input id="fuelKilograms" data-unit="Kilograms" type="number" inputmode="decimal" step="any"></label>
          <label>Litres<input id="fuelLitres" data-unit="Litres" type="number" inputmode="decimal" step="any"></label>
          <label>US Gallons<input id="fuelUsGallons" data-unit="US Gallons" type="number" inputmode="decimal" step="any"></label>
          <label>Imperial Gallons<input id="fuelImpGallons" data-unit="Imperial Gallons" type="number" inputmode="decimal" step="any"></label>
        </div>

        <div class="button-row">
          <button id="fuelCalculate" class="primary-button" type="button">Calculate</button>
          <button id="fuelClear" type="button">Clear</button>
        </div>
        <p id="fuelStatus" class="status-line">Ready</p>
      </section>

      <section id="time" class="tab-panel" aria-labelledby="time-tab">
        <div class="time-display" aria-live="polite">
          <span id="timeExpression">0</span>
          <strong id="timeResult">0</strong>
        </div>
        <div class="calculator-grid" id="timeButtons">
          <button type="button">7</button>
          <button type="button">8</button>
          <button type="button">9</button>
          <button class="operator" type="button">÷</button>
          <button type="button">4</button>
          <button type="button">5</button>
          <button type="button">6</button>
          <button class="operator" type="button">×</button>
          <button type="button">1</button>
          <button type="button">2</button>
          <button type="button">3</button>
          <button class="operator" type="button">−</button>
          <button type="button">0</button>
          <button type="button">.</button>
          <button type="button">:</button>
          <button class="operator" type="button">+</button>
          <button class="utility" type="button">C</button>
          <button class="utility" type="button">←</button>
          <button class="utility" type="button">: to .</button>
          <button class="equals" type="button">=</button>
        </div>
        <p id="timeStatus" class="status-line">Ready</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
